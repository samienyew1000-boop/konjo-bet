<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1114" />
  <title>Fast Keno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="desktop-bg" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <a class="icon-btn" href="../../index.html" aria-label="Back to lobby" title="Back to Lobby">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div class="credit">
        <strong id="balance">5000.00</strong>
        <span>ETB</span>
      </div>
      <div class="fair-id" id="round-hash" title="Round hash">ID:</div>
      <button type="button" class="icon-btn" id="btn-menu" aria-label="Menu">
        <img src="asset/menu.svg" alt="" />
      </button>
    </header>

    <div class="mobile-tabs">
      <button type="button" class="m-tab active" data-pane="game">Game</button>
      <button type="button" class="m-tab" data-pane="live">Tickets</button>
      <button type="button" class="m-tab" data-pane="results">Results</button>
    </div>

    <div class="layout">
      <aside class="side left-side" data-pane="live">
        <div class="side-tabs">
          <button type="button" class="tab on" data-left="game"><i class="icn tab-game"></i>GAME</button>
          <button type="button" class="tab" data-left="history"><i class="icn tab-hist"></i>HISTORY</button>
        </div>
        <div class="sub-tabs" id="left-sub">
          <button type="button" class="sub on" data-feed="all">All <em id="count-all">0</em></button>
          <button type="button" class="sub" data-feed="tickets">My Tickets <em id="count-tickets">0</em></button>
          <button type="button" class="sub" data-feed="bets">My Bets <em id="count-bets">0</em></button>
        </div>
        <div class="side-scroll" id="live-list"></div>
      </aside>

      <section class="stage">
        <img class="keno-logo" src="asset/logo.png" alt="Fast Keno" />
        <div class="timer" id="timer">00:00</div>

        <div class="ticket" id="ticket">
          <div class="ticket-empty" id="ticket-empty">
            <div class="help-q" id="btn-help">?</div>
            <p>Choose 10 numbers</p>
            <span>From 1 to 80</span>
          </div>
          <div class="ticket-sel hidden" id="ticket-sel">
            <div class="sel-head">
              <strong id="picked-count">0</strong>
              <em>numbers</em>
              <span class="possible" id="possible-win">Possible win 0.00</span>
            </div>
            <div class="pay-row" id="pay-match"></div>
            <div class="pay-row pays" id="pay-odds"></div>
            <div class="picked-row" id="picked-row"></div>
          </div>
          <div class="draw-stage hidden" id="draw-stage">
            <div class="draw-count"><span id="drawn-count">00</span> / 20</div>
            <div class="draw-balls" id="draw-balls"></div>
          </div>
        </div>

        <div class="board" id="board"></div>

        <div class="bet-bar">
          <div class="stake">
            <button type="button" class="step" id="bet-minus" aria-label="Decrease"><img src="asset/mns.svg" alt="" /></button>
            <input id="bet-amt" type="number" min="1" max="10000" value="1" />
            <button type="button" class="step" id="bet-plus" aria-label="Increase"><img src="asset/pls.svg" alt="" /></button>
          </div>
          <button type="button" class="quick" id="bet-x2">X2</button>
          <button type="button" class="quick" id="bet-max">MAX</button>
          <button type="button" class="bet-btn" id="bet-btn">
            <span class="lab-bet">BET</span>
            <span class="lab-wait">WAIT...</span>
            <span class="lab-ok"><img src="asset/check.svg" alt="" /> BET ACCEPTED</span>
          </button>
        </div>
      </section>

      <aside class="side right-side" data-pane="results">
        <div class="side-tabs">
          <button type="button" class="tab on" data-right="results"><i class="icn tab-res"></i>RESULTS</button>
          <button type="button" class="tab" data-right="stats"><i class="icn tab-stat"></i>STATISTICS</button>
          <button type="button" class="tab" data-right="leaders"><i class="icn tab-lead"></i>LEADERS</button>
        </div>
        <div class="side-scroll" id="right-panel"></div>
      </aside>
    </div>
  </div>

  <div class="overlay hidden" id="result-overlay">
    <div class="result-card" id="result-card">
      <h2 id="result-title">WIN</h2>
      <p id="result-detail"></p>
      <button type="button" class="again" id="result-close">OK</button>
    </div>
  </div>

  <div class="menu hidden" id="menu">
    <button type="button" class="menu-close" id="menu-close" aria-label="Close"><img src="asset/close_menu.svg" alt="" /></button>
    <h3>How to play</h3>
    <p>Pick 1 to 10 numbers from 1–80. Each round draws 20 balls. Odds depend on how many you picked and how many you hit.</p>
    <div class="pay-wrap" id="full-paytable"></div>
    <p class="rtp">RTP 97% · Max win 10,000×</p>
  </div>

  <script src="../shared-balance.js"></script>
  <script src="game.js"></script>
</body>
</html>
